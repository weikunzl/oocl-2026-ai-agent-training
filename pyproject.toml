[project]
name = "oocl-2026-ai-agent-training"
version = "0.1.0"
description = "OOCL 2026 AI Agent Training — Hello World environment check"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.11",
  "langchain>=1.3.15",
  "langchain-openai>=1.4.3",
  "langchain-core>=1.5.4",
  "python-dotenv>=1.2.2",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1.1",
  "ipykernel>=7.3.0",
  "langgraph-cli[inmem]>=0.4.0",
]
# 04-memory Postgres 耐久 demo（notebooks/04-memory-postgres-demo.ipynb）
memory-postgres = [
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent", "src/bacp_agent"]
